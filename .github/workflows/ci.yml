name: Astro CI
on:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Validate indexability
        run: |
          test -s dist/robots.txt
          test -s dist/sitemap-index.xml
          grep -q '^User-agent: \* dist/robots.txt
          grep -q '^Allow: / dist/robots.txt
          grep -q 'Sitemap: https://mgakasinot.com/sitemap-index.xml' dist/robots.txt
          grep -q 'https://mgakasinot.com/' dist/sitemap-index.xml
          if grep -Ril --include='*.html' 'noindex' dist; then
            echo "Found noindex in generated HTML"
            exit 1
          fi
          grep -q '<meta name="robots" content="index,follow' dist/index.html
          grep -q '<link rel="canonical" href="https://mgakasinot.com/"' dist/index.html
