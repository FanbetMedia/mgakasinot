name: Build and deploy Astro

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_BUILD_SHA: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run check:links
      - name: Validate indexability and build marker
        run: |
          set -euo pipefail
          test -s dist/robots.txt
          test -s dist/sitemap-index.xml
          grep -Fq "User-agent: *" dist/robots.txt
          grep -Fq "Allow: /" dist/robots.txt
          grep -Fq "Sitemap: https://mgakasinot.com/sitemap-index.xml" dist/robots.txt
          grep -Fq "https://mgakasinot.com/" dist/sitemap-index.xml
          if grep -Ril --include="*.html" "noindex" dist; then
            echo "Found noindex in generated HTML"
            exit 1
          fi
          grep -Fq '<meta name="robots" content="index,follow' dist/index.html
          grep -Fq '<link rel="canonical" href="https://mgakasinot.com/"' dist/index.html
          grep -Fq 'name="x-build-sha"' dist/index.html
          grep -Fq "$PUBLIC_BUILD_SHA" dist/index.html
          grep -Fq 'SYVENTÄVÄ MGA-OPAS' dist/index.html
          grep -Fq 'Koko MGA-opas selkeämpänä kokonaisuutena' dist/index.html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Sync MGA domain registry
        run: |
          set -euo pipefail
          npm run sync:mga
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("public/mga-sites.json","utf8")); if(!Array.isArray(d.entries)||d.entries.length<300) process.exit(1); for(const x of ["casimba.com","bet365.com"]) if(!d.entries.some(e=>e.domain===x)) process.exit(1); console.log(`Validated ${d.entries.length} MGA domains`);'
      - run: npm run build
      - run: npm run check:links

      - name: Deploy dist to SiteGround
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SG_SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
          SSH_HOST: ${{ secrets.SG_SSH_HOST }}
          SSH_USER: ${{ secrets.SG_SSH_USER }}
          SSH_PORT: ${{ secrets.SG_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/siteground_key
          chmod 600 ~/.ssh/siteground_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          cat > ~/.ssh/askpass.sh <<'EOF'
          #!/bin/sh
          echo "$SSH_PASSPHRASE"
          EOF
          chmod 700 ~/.ssh/askpass.sh
          export SSH_ASKPASS=~/.ssh/askpass.sh SSH_ASKPASS_REQUIRE=force DISPLAY=:0 SSH_PASSPHRASE
          setsid ssh-add ~/.ssh/siteground_key </dev/null

          test -f dist/index.html
          test -f dist/mga-sites.json
          grep -Fq "$PUBLIC_BUILD_SHA" dist/index.html
          grep -Fq 'SYVENTÄVÄ MGA-OPAS' dist/index.html
          grep -Fq 'casimba.com' dist/mga-sites.json
          grep -Fq 'bet365.com' dist/mga-sites.json

          if [ -d dist/_astro ]; then
            rsync -az -e "ssh -p $SSH_PORT" dist/_astro/ "$SSH_USER@$SSH_HOST:/home/customer/www/mgakasinot.com/public_html/_astro/"
          fi

          rsync -az --delete \
            --exclude='.well-known/' \
            --exclude='php_errorlog' \
            --exclude='_astro/' \
            --exclude='wp-content/uploads/' \
            -e "ssh -p $SSH_PORT" \
            dist/ "$SSH_USER@$SSH_HOST:/home/customer/www/mgakasinot.com/public_html/"

          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" '
            set -e
            cd /home/customer/www/mgakasinot.com/public_html
            test -s index.html
            test -s robots.txt
            test -s sitemap-index.xml
            test -s mga-sites.json
            grep -Fq "casimba.com" mga-sites.json
            grep -Fq "bet365.com" mga-sites.json
            grep -Fq "SYVENTÄVÄ MGA-OPAS" index.html
            grep -Fq "Koko MGA-opas selkeämpänä kokonaisuutena" index.html
            grep -q "application/ld+json" index.html
            grep -q "property=\"og:title\"" index.html
            grep -q "DirectoryIndex index.html" .htaccess
            grep -Fq "public, max-age=0, must-revalidate" .htaccess
            grep -Fq "max-age=31536000, immutable" .htaccess
            grep -Fq "max-age=2592000" .htaccess
            grep -Fq "no-cache, no-store, max-age=0, must-revalidate" .htaccess
            grep -Fq "User-agent: *" robots.txt
            grep -Fq "Allow: /" robots.txt
            grep -Fq "Sitemap: https://mgakasinot.com/sitemap-index.xml" robots.txt
            grep -Fq "https://mgakasinot.com/" sitemap-index.xml
            if grep -Ril --include="*.html" "noindex" .; then
              echo "Found noindex on deployed HTML"
              exit 1
            fi
            grep -q "<meta name=\"robots\" content=\"index,follow" index.html
            grep -q "<link rel=\"canonical\" href=\"https://mgakasinot.com/\"" index.html
          '

          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "grep -Fq '$PUBLIC_BUILD_SHA' /home/customer/www/mgakasinot.com/public_html/index.html"

      - name: Verify canonical public homepage is on this commit
        run: |
          set -euo pipefail
          url="https://mgakasinot.com/"
          success=0

          for attempt in $(seq 1 20); do
            body="$(mktemp)"
            headers="$(mktemp)"

            if curl -fsS \
              --connect-timeout 10 \
              --max-time 30 \
              -D "$headers" \
              "$url" \
              -o "$body"; then
              if grep -Fq "$PUBLIC_BUILD_SHA" "$body" \
                && grep -Fq 'SYVENTÄVÄ MGA-OPAS' "$body" \
                && grep -Fq 'Koko MGA-opas selkeämpänä kokonaisuutena' "$body"; then
                echo "Canonical production homepage is serving build $PUBLIC_BUILD_SHA"
                echo "Relevant production headers:"
                grep -Ei '^(cache-control|x-accel-expires|x-proxy-cache|x-sg-cdn|age):' "$headers" || true
                success=1
                rm -f "$body" "$headers"
                break
              fi

              echo "Attempt $attempt returned a different homepage build."
              grep -o 'name="x-build-sha" content="[^"]*"' "$body" || true
              grep -Ei '^(cache-control|x-accel-expires|x-proxy-cache|x-sg-cdn|age):' "$headers" || true
            fi

            rm -f "$body" "$headers"
            sleep 3
          done

          if [ "$success" -ne 1 ]; then
            echo "Production smoke test failed: canonical https://mgakasinot.com/ is still serving stale HTML to a normal request."
            echo "Do not treat this deploy as live until the SiteGround Dynamic Cache/CDN cache has been purged once."
            exit 1
          fi
